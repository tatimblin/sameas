[package]
name = "sameas-core"
description = "Entity resolution & completion core: typed identifier crosswalk graph over SQLite."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
rusqlite = { version = "0.31", features = ["bundled"] }
url = "2"
psl = "2"
phonenumber = "0.3"
scraper = "0.20"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", features = ["blocking", "json"], optional = true }

[features]
# Live HTTP fetch for DomainResolver. Off by default so CI + demo stay offline
# and deterministic via HTML fixtures.
live-fetch = ["dep:reqwest"]

[dev-dependencies]
tempfile = "3"
