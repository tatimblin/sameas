name: Sync worker secrets

# Manual only. A routine deploy should never rewrite secrets — this exists so the
# per-environment secret set is reproducible from GitHub Environments rather than
# living only in someone's shell history.
#
# Mirrors agent-web's workflow of the same name. Secrets are per-script and are
# never copied between environments: `--env staging` targets `sameas-staging`,
# omitting it targets `sameas`.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which environment's secrets to push"
        type: choice
        options: [staging, production]
        required: true

concurrency:
  group: sync-secrets-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ENV_FLAG: ${{ inputs.environment == 'staging' && '--env staging' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bin/worker/package-lock.json
      - run: npm ci
        working-directory: bin/worker

      # AUTH_TOKEN gates every write route and `POST /resolve/name`, which spends
      # money. `auth_outcome` fails CLOSED on an unset OR empty token (503
      # write_disabled), so an absent secret is never a bypass — but it does take
      # the route offline, which is why this one is required rather than skipped.
      - name: Push AUTH_TOKEN (required)
        working-directory: bin/worker
        env:
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
        run: |
          if [ -z "$AUTH_TOKEN" ]; then
            echo "::error::AUTH_TOKEN is not set in the '${{ inputs.environment }}' environment. Without it every write route and /resolve/name answers 503 write_disabled."
            exit 1
          fi
          printf '%s' "$AUTH_TOKEN" | npx --no-install wrangler secret put AUTH_TOKEN $ENV_FLAG

      # Hub keys are OPTIONAL and each is skipped when unset, deliberately.
      #
      # An absent key means that hub is simply not called: the route answers 200
      # `unresolved` with `hub_called: false`, spends no budget, and hints which
      # secret is missing. Wikidata needs no key, so the free fallback always works.
      #
      # Pushing an EMPTY string instead of skipping would be worse than useless —
      # the key would read as present and every call to that hub would fail at the
      # provider with an auth error instead of degrading cleanly. agent-web learned
      # this the same way (see the ENCRYPTION_KEY note in its sync-secrets.yml).
      #
      # Cost note: GOOGLE_PLACES_API_KEY is the only billable one. Google Place
      # Details with websiteUri/phone is the Enterprise SKU. TMDb, Wikidata and
      # Placekey are free.
      - name: Push hub API keys (optional — skipped when unset)
        working-directory: bin/worker
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          PLACEKEY_API_KEY: ${{ secrets.PLACEKEY_API_KEY }}
        run: |
          for name in GOOGLE_PLACES_API_KEY TMDB_API_KEY PLACEKEY_API_KEY; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::notice::$name is unset for '${{ inputs.environment }}' — skipping. That hub will not be called; the route degrades rather than failing."
              continue
            fi
            printf '%s' "$value" | npx --no-install wrangler secret put "$name" $ENV_FLAG
            echo "pushed $name"
          done

      # Names only — `secret list` never prints values.
      - name: Show what the worker now has
        working-directory: bin/worker
        run: npx --no-install wrangler secret list $ENV_FLAG
